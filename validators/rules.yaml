    CORE.GENERAL.DURATION_Y x 12 + CORE.GENERAL.DURATION_M, so DURATION_M is the additional months
    beyond whole years, not a raw month count.
  inputs:
  - CORE.GENERAL.DURATION_M
  chain_step: project
  source:
    derived_from: docs/design/PLAN.md
    locator: plan §E "Rule families" (S family, structure); S010's own arithmetic (core/02 §10.1
      V-S07; 04 §30.3 V-I03) fixes the DURATION_Y/DURATION_M unit convention this rule enforces.
  negative_fixture: tests/fixtures/negative/S012/
  notes: Added in the v0.1.0 release pass alongside the S010 fix to examples/lecturer-no-ai/project.yaml
    (DURATION_M was 12, i.e. a whole extra year, which S010's formula would silently double-count).
