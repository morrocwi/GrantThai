# validators/rules.yaml — the validation rule catalog, as data.
# Structure is JSON Schema's job (spec/); these are the logic rules that
# src/grantthai/validators implements. Schema: spec/validators/rule.schema.json.
#
# Sources: rule ids and wording follow the handoff package core/01 §28
# (founder-owned, K13) and the design plan docs/design/PLAN.md §E "Rule
# families". severity_basis: plan = the severity is stated or implied by the
# plan; proposed_default = a scaffold default (INSTINCT) that a maintainer may
# revise through a reviewed PR.
#
# Every BLOCK rule gets one failing fixture under negative_fixture when its
# implementation ships (acceptance test AT-4). No rule here quotes a
# time-bound fund value: thresholds, rates and eligibility live only in the
# bound fund profile (P6).
schema: grantthai.rules.v0
version: 0.1.0-draft
severity_levels:
  BLOCK: Must be fixed before the project can be LOCKED; counted in validation_summary.block. A BLOCK
    never stops `grantthai build` from rendering; it is listed in the readiness summary.
  REVIEW: A human should look at it; counted in validation_summary.review.
  INFO: Informational; counted in validation_summary.info.
rule_families:
- family: S
  ships: v0.1
  checks: structure
  ids_status: enumerated
- family: R
  ships: v0.1
  checks: research logic
  ids_status: enumerated
- family: W
  ships: v0.1
  checks: workplan, including progress weights summing to 100
  ids_status: enumerated
- family: B
  ships: v0.1
  checks: budget (line = qty x persons x times x unit; totals match)
  ids_status: enumerated
- family: T
  ships: v0.1
  checks: team contributions sum to 100
  ids_status: enumerated
- family: CH
  ships: v0.1
  checks: causal DAG, required stages (CH001-CH002); claim-strength downgrade (CH003, v0.2)
  ids_status: enumerated
- family: F
  ships: v0.1
  checks: fund rule has a source; staleness; profile ACTIVE; no historical rule reused
  ids_status: enumerated
- family: ELIG
  ships: v0.1
  checks: PI eligibility per the bound fund profile
  ids_status: enumerated
- family: E
  ships: v0.2
  checks: ethics; third parties, dual roles and vulnerable groups in experience accounts
  ids_status: enumerated
- family: U
  ships: v0.2
  checks: utilization
  ids_status: enumerated
- family: P
  ships: v0.2
  checks: policy
  ids_status: enumerated
- family: G
  ships: v0.2
  checks: geography
  ids_status: enumerated
- family: X
  ships: v0.2
  checks: misuse of experience, mappings, AI drafts and review records
  ids_status: enumerated
- family: ECO
  ships: v0.2
  checks: ecosystem checks for declared positions only
  ids_status: NEEDS_INPUT
- family: PARITY/DET
  ships: ci_only
  checks: build parity and determinism (CI tests, not project rules)
  ids_status: ci_only
