# validators/crosswalk.yaml — every validation code in the handoff package
# (core/02 §10 V-*, core/04 §30 V-*, core/05 VAL.*) mapped onto GrantThai
# rule ids in validators/rules.yaml. The same V- code means different things
# in core/02 and core/04 (e.g. V-R06), so each entry is keyed by source AND
# code. coverage: full = the rule(s) check what the code says; partial = part
# of it (see note); none = not checked (see note for why and when).
# tests/test_rules_added.py checks every rule id exists and the per-source counts.
