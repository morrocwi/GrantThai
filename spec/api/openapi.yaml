openapi: 3.1.0
info:
  title: GrantThai local API
  version: 0.3.0-draft
  summary: One work object in, one output route (the researcher's choice), exactly one file out.
  description: |
    A small, local-first HTTP API over the GrantThai engine (grantthai.api_py).
    A researcher's AI assistant (any vendor) uses it to fill in the
    researcher's work file (work.yaml 0.3, or a legacy project.yaml 0.2) and
    build exactly one overview file per output route:
    build/NRIIS_SUBMISSION.md (route nriis-proposal), build/ACADEMIC_ARTICLE.md
    (route academic-article) or build/RESEARCH_CONCEPT_NOTE.md (route
    concept-note). NRIIS is one route of the router, not the core.

    The route is the researcher's choice. With no `route` in a request the
    server resolves it only from what a person declared: routing.default_route
    in work.yaml, nriis-proposal for a legacy project.yaml, or the one route
    that is the default for the file's work_type. When none of these decides,
    validate and build answer 409 with `candidates` and write nothing. The
    server never picks a route. A legacy call with no route keeps the 0.1
    behaviour (NRIIS_SUBMISSION.md).

    Rules every caller gets, enforced by the engine, not by the caller:
    - The researcher's own information is the source. Values written here
      end at status DRAFT (or NEEDS_INPUT when cleared). Nothing raises a
      status above DRAFT, and nothing is ever submitted to NRIIS.
    - Every value written here is recorded as AI-assisted (the caller is an
      assistant acting for the researcher). By default it is stored as
      authored_by ai_draft / provenance_class INFERENCE. When the value is
      the researcher's own words, unchanged, send researcher_verbatim: true;
      it is then stored as authored_by human_ai_assisted / DECISION. Either
      way it is listed in the output for the researcher to confirm.
      provenance_class SOURCE and actor "human" are refused (400), and the
      caller cannot choose authored_by.
    - Do not invent Thai fund, NRIIS, institutional or journal facts. Send
      the value "NEEDS_VERIFICATION" when a fact is not known from the
      researcher; it is stored as an empty value plus that marker.
    - validate and check are report-only; they never change the work file.

    The API binds 127.0.0.1 by default, has no authentication and stores no
    credentials. Project data lives only in its working directory.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8765
    description: Local server (python -m grantthai.api). Replace with your own HTTPS URL if you expose it behind your own authenticating proxy.
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check.
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  service: {type: string}
                  can_submit: {type: boolean}
                  max_status: {type: string}
  /fields:
    get:
      operationId: listFields
      summary: List the fields of one route. Without route (or for nriis-proposal), NRIIS boxes first in entry order, then fields with tab NOT_ON_TAB; for another route its placement order, then NOT_PLACED.
      description: Thai labels and NRIIS tab names are NEEDS_VERIFICATION until confirmed. `required` is the route's own BLOCK set.
      parameters:
        - name: tab
          in: query
          required: false
          schema: {type: string}
          description: Only fields on this tab (or placement section).
        - name: required
          in: query
          required: false
          schema: {type: boolean}
          description: Only required fields.
        - name: route
          in: query
          required: false
          schema: {type: string}
          description: Output route id (GET /routes). Default nriis-proposal.
      responses:
        "200":
          description: The field list.
          content:
            application/json:
              schema:
                type: object
                required: [fields]
                properties:
                  route: {type: string}
                  fields:
                    type: array
                    items: {$ref: "#/components/schemas/FieldInfo"}
        "404": {$ref: "#/components/responses/Error"}
  /routes:
    get:
      operationId: listRoutes
      summary: List every output route (routes/INDEX.yaml). The list never chooses; the researcher does.
      responses:
        "200":
          description: The routes, in INDEX order. A route whose file fails its contract is still listed, with `error` set.
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items: {$ref: "#/components/schemas/RouteInfo"}
                  note: {type: string}
  /routes/{route}/profiles:
    get:
      operationId: listStructureProfiles
      summary: List a route's structure profiles (academic-article; the 7SSA layouts). The list never chooses; the researcher does.
      parameters:
        - name: route
          in: path
          required: true
          schema: {type: string}
          description: Output route id (GET /routes).
      responses:
        "200":
          description: The profiles with their visible sections; `selected` and `candidates` are null here (they need a work object; see the CLI `route profiles PATH`).
          content:
            application/json:
              schema:
                type: object
                required: [route, profiles]
                properties:
                  route: {type: string}
                  profiles: {type: array, items: {type: object}}
                  selected: {type: ["string", "null"]}
                  candidates: {type: ["object", "null"]}
                  note: {type: string}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /rules/{rule_id}:
    get:
      operationId: explainRule
      summary: Explain one validator rule (e.g. S001, B002, SCHEMA).
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The rule catalog entry and how v0.1 treats it.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404": {$ref: "#/components/responses/Error"}
  /projects:
    post:
      operationId: createProject
      summary: Create a blank work file (required fields present as NEEDS_INPUT). With work_type a work.yaml 0.3; without it a legacy project.yaml 0.2.
      description: |
        No route is written: the researcher chooses it later (GET /routes) and
        names it per request, or declares routing.default_route in the file.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                project_id:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
                  description: Also the id used in URLs. Omit it to get a generated id (the id in the file stays NEEDS_INPUT).
                work_type:
                  type: string
                  enum: [research_proposal, academic_article, concept_note, thesis_proposal, conference_abstract, final_report]
                  description: What the researcher is making. Given, the file is work.yaml (schema 0.3) and its NEEDS_INPUT fields are the required set of the work type's default route. Sets defaults only; never refuses a route.
                fund_profile_id:
                  type: string
                  description: Defaults to example/FICTIONAL_CALL@0.1 for a legacy project.yaml or a work type whose default route needs a fund binding; otherwise none.
                mode:
                  type: string
                  enum: [expert, human_direct, citizen]
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id, project, data_warning]
                properties:
                  id: {type: string}
                  project: {type: object, additionalProperties: true}
                  file: {type: string, enum: [work.yaml, project.yaml]}
                  default_route: {type: [string, "null"], description: "The route a build with no `route` would use, or null when the researcher must choose (see candidates)."}
                  candidates: {type: array, items: {type: string}}
                  data_warning:
                    type: object
                    description: Show this to the researcher BEFORE accepting any research data (personal, confidential or dual-use data must not go into a public AI; docs/policy/ai-use-ceiling.md section 5).
                    required: [en, th]
                    properties:
                      en: {type: string}
                      th: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}:
    get:
      operationId: getProject
      summary: Read the work file (work.yaml or project.yaml, returned as JSON).
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                type: object
                required: [id, project, data_warning]
                properties:
                  id: {type: string}
                  project: {type: object, additionalProperties: true}
                  data_warning:
                    type: object
                    description: Show this to the researcher BEFORE accepting any research data (personal, confidential or dual-use data must not go into a public AI; docs/policy/ai-use-ceiling.md section 5).
                    required: [en, th]
                    properties:
                      en: {type: string}
                      th: {type: string}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/fields:
    patch:
      operationId: setFields
      summary: Set one or more field values (status DRAFT at most; all-or-nothing).
      description: |
        Send either one update object, or {"updates": [ ... ]}. If any update
        is refused, nothing is written. Every write is recorded as
        AI-assisted; set researcher_verbatim for the researcher's own words
        and name the assistant in tool.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/FieldUpdate"
                - type: object
                  additionalProperties: false
                  required: [updates]
                  properties:
                    updates:
                      type: array
                      minItems: 1
                      items: {$ref: "#/components/schemas/FieldUpdate"}
      responses:
        "200":
          description: The written records.
          content:
            application/json:
              schema:
                type: object
                required: [id, written]
                properties:
                  id: {type: string}
                  written:
                    type: array
                    items: {type: object, additionalProperties: true}
                  note: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/validate:
    post:
      operationId: validateProject
      summary: Validation report for one route (report-only; persists nothing).
      description: |
        With no `route`, the route is resolved from the researcher's own
        declaration only; when that does not decide, 409 with `candidates`.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RouteRequest"}
      responses:
        "200":
          description: The report (spec/common/validation_report.schema.json).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationReport"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Candidates"}
  /projects/{id}/routes/{route}/check:
    post:
      operationId: checkRoute
      summary: Route-scoped validation report for an explicitly named route (report-only).
      description: |
        The route is the researcher's choice, named in the path. Only the
        rules in that route's scope run (RT002 counts the rest in one INFO
        line). Use it to show the researcher what a route still lacks
        before they decide.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: route
          in: path
          required: true
          schema: {type: string}
          description: Output route id (GET /routes).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                as_of: {type: string, format: date}
                sub_profile: {type: string}
                structure_profile: {type: string}
      responses:
        "200":
          description: The report (spec/common/validation_report.schema.json).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationReport"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/build:
    post:
      operationId: buildSubmission
      summary: Build exactly one overview file, build/<route output filename>, and return it.
      description: |
        NRIIS_SUBMISSION.md for nriis-proposal, ACADEMIC_ARTICLE.md for
        academic-article, RESEARCH_CONCEPT_NOTE.md for concept-note. Always
        renders; BLOCK findings are listed in the file's readiness summary.
        The same input, route and as_of give byte-identical text. Building a
        second route leaves the first route's file byte-identical. With no
        `route`, the route is resolved from the researcher's own declaration
        only; when that does not decide, 409 with `candidates` and nothing is
        written. Default response is the Markdown text; ?format=json wraps it
        in JSON (easier for some AI tool runners).
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [markdown, json]
            default: markdown
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RouteRequest"}
      responses:
        "200":
          description: The file text.
          content:
            text/markdown:
              schema: {type: string}
            application/json:
              schema:
                type: object
                required: [id, route, filename, markdown]
                properties:
                  id: {type: string}
                  route: {type: string}
                  filename: {type: string, enum: [NRIIS_SUBMISSION.md, ACADEMIC_ARTICLE.md, RESEARCH_CONCEPT_NOTE.md]}
                  markdown: {type: string}
                  summary:
                    type: object
                    properties:
                      block: {type: integer}
                      review: {type: integer}
                      info: {type: integer}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Candidates"}
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
    Candidates:
      description: No route could be resolved from the researcher's declaration (the server never picks), a renderer is missing, or two canonical inputs sit in the project folder. Nothing was written.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              candidates:
                type: array
                items: {type: string}
                description: Route ids the researcher can choose from; pass one as `route`.
  schemas:
    AsOf:
      type: object
      additionalProperties: false
      properties:
        as_of:
          type: string
          format: date
          description: Date the fund rules are checked against (default today). Fix it for reproducible output.
    RouteRequest:
      type: object
      additionalProperties: false
      properties:
        as_of:
          type: string
          format: date
          description: Date the fund rules are checked against (default today). Fix it for reproducible output.
        route:
          type: string
          description: Output route id (GET /routes). Optional; see the description of this endpoint for how a missing route is resolved, and that it is never picked by the server.
        sub_profile:
          type: string
          description: A sub-profile of the route (a form profile for nriis-proposal; thai-journal or international-journal for academic-article, both NEEDS_VERIFICATION). Default routing.sub_profiles[route], else the route's own default.
        structure_profile:
          type: string
          description: A 7SSA structure profile of the academic-article route (7ssa-world, 7ssa-thai-7, 7ssa-thai-5, 7ssa-thai-4; GET /routes/academic-article/profiles), chosen by the researcher. Default routing.structure_profiles[route], else none (the plain overview). The server never chooses one.
        output_format:
          type: string
          enum: [md, tex]
          description: Build only. md (default) = the route's Markdown file; tex = the academic-article LaTeX export build/ACADEMIC_ARTICLE.tex INSTEAD (needs a selected 7SSA profile; English only; no LaTeX engine is run).
        glosa_audit:
          type: boolean
          description: Build with output_format tex only. Keep the template's glosa audit appendices.
    ValidationReport:
      type: object
      required: [summary, findings]
      additionalProperties: true
      properties:
        summary:
          type: object
          properties:
            block: {type: integer}
            review: {type: integer}
            info: {type: integer}
        findings:
          type: array
          items: {type: object, additionalProperties: true}
    RouteInfo:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        status: {type: string}
        version: {type: string}
        title_en: {type: [string, "null"]}
        output_filename: {type: [string, "null"]}
        accepts_work_types: {type: array, items: {type: string}}
        default_for_work_types: {type: array, items: {type: string}}
        needs_fund_binding: {type: [boolean, "null"]}
        ready_flag: {type: [string, "null"], description: "submittable (nriis-proposal), manuscript_ready (academic-article; never means accepted or publishable), or the always-false flag of concept-note."}
        error: {type: [string, "null"]}
    FieldInfo:
      type: object
      additionalProperties: true
      properties:
        field_id: {type: string}
        tab: {type: string, description: "An NRIIS tab (NEEDS_VERIFICATION), NOT_ON_TAB for a field that is not an NRIIS box, a placement section of another route, or NOT_PLACED."}
        entry_order: {type: integer}
        origin: {type: [string, "null"], enum: [NRIIS_NATIVE, FUND_PROFILE, AUTHORING_CORE, DERIVED, RECOMMENDED_EXTENSION, VENUE_NATIVE, null]}
        label_en: {type: string}
        label_th: {type: string}
        type: {type: [string, "null"]}
        cardinality: {type: [string, "null"]}
        required: {type: boolean}
        chain_node: {type: [string, "null"]}
        allowed_values: {type: [array, "null"]}
        guidance_en: {type: [string, "null"]}
    FieldUpdate:
      type: object
      additionalProperties: false
      required: [field_id, value]
      properties:
        field_id: {type: string, description: "A registry field id (GET /fields), or chain content with chain_node."}
        value:
          description: The value. "NEEDS_INPUT" or null clears it; "NEEDS_VERIFICATION" stores an empty value plus that marker.
        actor:
          type: string
          enum: [ai_assisted]
          default: ai_assisted
          description: Optional. Every HTTP write is AI-assisted; any other value is refused.
        researcher_verbatim:
          type: boolean
          default: false
          description: True only if the value is the researcher's own words, unchanged (stored as human_ai_assisted / DECISION). Otherwise it is the assistant's draft (ai_draft / INFERENCE).
        chain_node:
          type: string
          description: For chain content not in the registry (e.g. PriorKnowledge, Evidence, Claim).
        provenance:
          type: object
          additionalProperties: false
          description: Optional. provenance_class SOURCE is refused; authored_by is set by the server.
          properties:
            provenance_class: {type: string, enum: [INFERENCE, DECISION, DERIVED]}
            source_type: {type: string}
            evidence_role: {type: string}
        source_ids:
          type: array
          items: {type: string}
        links:
          type: object
          additionalProperties: true
        tool:
          type: string
          description: The AI tool to disclose (recorded under authoring.tools_disclosed and authoring.ai_use_declaration.tools). Default http-client.
        tool_version:
          type: string
          description: The tool's version, recorded in authoring.ai_use_declaration.tools. Omitted = NEEDS_INPUT for the researcher to fill.
        stage:
          type: string
          enum: [idea, proposal_writing, literature, data, analysis, writing, language_editing, review, publication]
          description: Research stage of this AI use. Default proposal_writing.
