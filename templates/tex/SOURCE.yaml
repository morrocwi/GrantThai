what_the_export_changes_in_the_filled_copy:
  - "Every [FILL token is replaced literally, LaTeX-escaped, by a work-object value named in the fill map, or by [NEEDS_INPUT: ...]; GrantThai composes no text."
  - "The seven sector section titles are replaced by the resolved English 7SSA headings (article-type overlay, else the world profile headings; CX-7SSA-02)."
  - "\\glosaaudittrue becomes \\glosaauditfalse unless --glosa-audit is given; \\thaiarticlefalse is kept (English-only export, CX-7SSA-06)."
  - "In the internal policy-interoperability table (audit appendix) every check/recommended/documented/journal-dependent cell becomes NEEDS_VERIFICATION: the publisher readings are relayed, never GrantThai facts."
  - "A comment header (the NOTICE constant, the route notice, the work id and the template sha256) is added before the first line."
  - "One visible plain line is typeset directly under \\maketitle: \"Draft prepared with GrantThai (unofficial); check the target journal's current instructions.\" (v0.3.0; docs/deviations.md)."
status_note: "The template's cross-publisher policy text is the founder's relayed reading and stays NEEDS_VERIFICATION against each venue's current author guidelines. The export is a draft for the researcher; it submits nothing and never says a manuscript is ready for any venue."
