# templates/tex/SOURCE.yaml — provenance of the vendored LaTeX template used by
# `grantthai build --route academic-article --format tex` (routes/academic-article/route.yaml `exports`).
#
# glosa_7ssa_v1.tex is a BYTE-IDENTICAL copy of the glosa-registered GLOSA-7SSA
# paper template. GrantThai never edits it: the renderer
# (src/grantthai/render/article_tex.py) checks the sha256 below before every
# export and refuses a template that does not match; the filled copy is
# written to build/ACADEMIC_ARTICLE.tex only. To take a newer glosa version,
# replace the file, re-pin the sha256, regenerate the fill map and record it
# in CHANGELOG.md.
