# --------------------------------------------------------------------------
# Completeness checklist. Basis is relayed: core/02 §15, core/01 §30 (copy/
# paste checklist) and SD-4 p166 (validation page) are named for it in
# docs/deviations.md and docs/BUILD_GUIDE.md; none of the three has been
# read for this file, so every item is NEEDS_VERIFICATION against them and
# stands as GrantThai's proposed default. Deterministic items are evaluated
# by src/grantthai/guidance/writing.py (PASS/OPEN); human items always
# render HUMAN_CHECK. Rendered as output section 4.6 (integrator).
completeness_checklist:
  - id: WC01
    check: {en: "Need, problem, gap and the primary research question are all written.", th: NEEDS_INPUT}
    field_ids: [CORE.RESEARCH.NATIONAL_NEED, CORE.RESEARCH.PROBLEM, CORE.RESEARCH.GAP, CORE.RESEARCH.RQ.PRIMARY]
    evaluable: deterministic
    kind: fields_filled
    basis: "core/02 §15 (relayed); NEEDS_VERIFICATION"
  - id: WC02
    check: {en: "Every objective names the research question it answers.", th: NEEDS_INPUT}
    field_ids: [CORE.RESEARCH.OBJECTIVES]
    evaluable: deterministic
    kind: items_have_key
    params: {key: rq_ids}
    basis: "core/02 §15 (relayed); registry:CORE.RESEARCH.OBJECTIVES guidance"
  - id: WC03
    check: {en: "Every objective names the method that reaches it.", th: NEEDS_INPUT}
    field_ids: [CORE.RESEARCH.OBJECTIVES]
    evaluable: deterministic
    kind: items_have_key
    params: {key: method_ids}
    basis: "core/02 §15 (relayed); registry:CORE.RESEARCH.OBJECTIVES guidance"
  - id: WC04
    check: {en: "Every objective names the output it produces.", th: NEEDS_INPUT}
    field_ids: [CORE.RESEARCH.OBJECTIVES]
    evaluable: deterministic
    kind: items_have_key
    params: {key: output_ids}
    basis: "core/02 §15 (relayed); registry:CORE.RESEARCH.OBJECTIVES guidance"
  - id: WC05
    check: {en: "Design, sample, instruments, data collection, analysis and ethics are all written.", th: NEEDS_INPUT}
    field_ids: [METHOD.PLAN.DESIGN, METHOD.PLAN.SAMPLE, METHOD.PLAN.INSTRUMENTS, METHOD.PLAN.DATA_COLLECTION, METHOD.PLAN.ANALYSIS, METHOD.PLAN.ETHICS]
    evaluable: deterministic
    kind: fields_filled
    basis: "core/02 §15 (relayed); NEEDS_VERIFICATION"
  - id: WC06
    check: {en: "Every output names the objective that produces it.", th: NEEDS_INPUT}
    field_ids: [RESULTS.CHAIN.OUTPUTS]
    evaluable: deterministic
    kind: items_have_key
    params: {key: objective_ids}
    basis: "core/02 §15 (relayed); NEEDS_VERIFICATION"
  - id: WC07
    check: {en: "The one-sentence alignment statement is written.", th: NEEDS_INPUT}
    field_ids: [CORE.ALIGNMENT.STATEMENT]
    evaluable: deterministic
    kind: fields_filled
    basis: "registry:CORE.ALIGNMENT.STATEMENT guidance; core/02 §4A.1 (relayed)"
  - id: WC08
    check: {en: "The narrative boxes (summary, rationale, objectives, framework, theory, method) are all written.", th: NEEDS_INPUT}
    field_ids: [CORE.NARRATIVE.SUMMARY, CORE.NARRATIVE.RATIONALE, CORE.NARRATIVE.OBJECTIVES, CORE.NARRATIVE.FRAMEWORK, CORE.NARRATIVE.THEORY, CORE.NARRATIVE.METHOD]
    evaluable: deterministic
    kind: fields_filled
    basis: "core/01 §30 copy/paste checklist (relayed); NEEDS_VERIFICATION"
  - id: WC09
    check: {en: "No narrative box or core field is outside its length target.", th: NEEDS_INPUT}
    field_ids: [CORE.NARRATIVE.SUMMARY, CORE.NARRATIVE.RATIONALE, CORE.NARRATIVE.METHOD, CORE.RESEARCH.OBJECTIVES, CORE.ALIGNMENT.STATEMENT]
    evaluable: deterministic
    kind: length_within
    basis: "core/02 §4A.2 compression targets (relayed); NEEDS_VERIFICATION"
  - id: WC10
    check: {en: "Titles and keywords are written in both languages.", th: NEEDS_INPUT}
    field_ids: [CORE.GENERAL.TITLE_TH, CORE.GENERAL.TITLE_EN, CORE.GENERAL.KEYWORDS_TH, CORE.GENERAL.KEYWORDS_EN]
    evaluable: deterministic
    kind: fields_filled
    basis: "core/01 §30 copy/paste checklist (relayed); NEEDS_VERIFICATION"
  - id: WC11
    check: {en: "Every factual claim in need, problem and gap has a source the reader can find.", th: NEEDS_INPUT}
    field_ids: [CORE.RESEARCH.NATIONAL_NEED, CORE.RESEARCH.PROBLEM, CORE.RESEARCH.GAP]
    evaluable: human
    basis: "core/02 §4B (relayed); NEEDS_VERIFICATION"
  - id: WC12
    check: {en: "Each narrative box says only what its render_from records say; nothing new is introduced in the box.", th: NEEDS_INPUT}
    field_ids: [CORE.NARRATIVE.SUMMARY, CORE.NARRATIVE.RATIONALE, CORE.NARRATIVE.OBJECTIVES, CORE.NARRATIVE.FRAMEWORK, CORE.NARRATIVE.THEORY, CORE.NARRATIVE.METHOD]
    evaluable: human
    basis: "core/02 §4E section purpose matrix (relayed); NEEDS_VERIFICATION"
  - id: WC13
    check: {en: "The summary and rationale read as the researcher's own words, and the person pasting them has re-read them once against the form.", th: NEEDS_INPUT}
    field_ids: [CORE.NARRATIVE.SUMMARY, CORE.NARRATIVE.RATIONALE]
    evaluable: human
    basis: "SD-4 p166 validation page (relayed); core/01 §30 (relayed); NEEDS_VERIFICATION"
  - id: WC14
    check: {en: "The results chain reaches the national need: at least one impact returns to it, with an honest claim strength.", th: NEEDS_INPUT}
    field_ids: [RESULTS.CHAIN.IMPACTS, CORE.RESEARCH.NATIONAL_NEED]
    evaluable: human
    basis: "core/02 §15 (relayed); NEEDS_VERIFICATION"
