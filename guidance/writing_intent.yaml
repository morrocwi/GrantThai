# guidance/writing_intent.yaml — the writing layer (v0.2, DRAFT).
# Schema: spec/guidance/writing_intent.schema.json. Reference implementation:
# src/grantthai/guidance/writing.py. Plain explanation for the skill:
# skills/grantthai/reference/writing.md.
#
# What this file is: for every research-core, methodology and results-chain
# field, what the box is FOR (purpose), a one-line shape to write into
# (micro_template), a length target with its basis, what to keep out, and
# the quality traits a reader may look for. Plus a completeness checklist.
#
# What this file is NOT: a validator of knowledge. Nothing here moves a
# status. Length findings (rules W101/W102) are REVIEW-level only. The
# researcher's own information is the source; a template is a shape, never
# content.
#
# Honesty markers:
# - The handoff package core/02 (§4A.2 compression targets, §4B writing
#   intent, §4E purpose matrix, §15 completeness) and core/01 §30 are
#   excluded from this public repository (docs/sources.md). Their readings
#   here are RELAYED through docs/design/PLAN.md, docs/deviations.md and the
#   registry, so every target that cites them is NEEDS_VERIFICATION, and a
#   target GrantThai set itself says `proposed_default`.
# - The 3,000-word cap on the summary and rationale comes from the registry
#   guidance (core/05, "observed instruction") and is NEEDS_VERIFICATION; the
#   public-form page for it has not been read here.
# - `seen_in` on a quality trait may only cite a real, publicly available
#   funded report by id and PDF page (R1 p8) — never quoted text. No reader
#   has recorded such pages yet, so every seen_in is NEEDS_INPUT.
# - Every Thai string is NEEDS_INPUT: no Thai wording is filled without a
#   cited source (tests/test_writing_intent.py).
schema: grantthai.writing_intent.v0
version: 0.2.0-draft
status: DRAFT
status_marker: NEEDS_VERIFICATION
derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
notes: >-
  Purpose and micro-template wording is GrantThai's own English, written
  from the registry guidance, the structured value contracts
  (spec/registry/structured_fields.schema.json) and the chain
  (spec/common/chain.yaml). It describes the box, not the research. Word
  counts are whitespace-separated tokens: for Thai prose without spaces a
  word target is unreliable, and the finding says so.

fields:
  # ---------------------------------------------------------------- CORE.GENERAL
  CORE.GENERAL.RESEARCH_ISSUE:
    purpose: {en: "Name the call's research issue this project answers, as the call lists it.", th: NEEDS_INPUT}
    micro_template: {en: "<research issue code or name exactly as the call document lists it>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.RESEARCH_ISSUE guidance (one selected issue)"}
    keep_out: ["an issue the call does not list", "a paraphrase of the call's wording"]
    quality_traits: [{trait: "matches one item of the call document, cited", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.PLAN:
    purpose: {en: "Point to the call plan or programme this project is submitted under.", th: NEEDS_INPUT}
    micro_template: {en: "<plan reference as given in FUND.CALL.PLAN.*>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.PLAN guidance (single reference)"}
    keep_out: ["a plan name typed from memory instead of the call document"]
    quality_traits: [{trait: "resolves to the bound call's plan", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.TITLE_TH:
    purpose: {en: "The project title in Thai: what is studied, with whom or where, to what end.", th: NEEDS_INPUT}
    micro_template: {en: "<object of study> <in/with site or group> <to achieve outcome> (Thai)", th: NEEDS_INPUT}
    length_target: {unit: chars, min: 10, max: 250, basis: "proposed_default (a title that fits one form line); NEEDS_VERIFICATION (no public page read for a title limit)"}
    keep_out: ["claims of novelty or scale not supported by the objectives", "abbreviations undefined elsewhere"]
    quality_traits: [{trait: "names the object, the site or group and the intended outcome", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.TITLE_EN:
    purpose: {en: "The same title in English, carrying the same three parts as the Thai title.", th: NEEDS_INPUT}
    micro_template: {en: "<Object of study> <in/with site or group> <to achieve outcome>", th: NEEDS_INPUT}
    length_target: {unit: words, min: 4, max: 30, basis: "proposed_default (a title that fits one form line); NEEDS_VERIFICATION (no public page read for a title limit)"}
    keep_out: ["a translation that adds or drops a part of the Thai title"]
    quality_traits: [{trait: "same object, site and outcome as the Thai title", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.REQUESTED_BUDGET:
    purpose: {en: "The amount requested from this call; it must equal the budget table total.", th: NEEDS_INPUT}
    micro_template: {en: "<sum of BUDGET.* line totals requested from this call>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.REQUESTED_BUDGET guidance (one money value)"}
    keep_out: ["a rounded figure that differs from the budget table"]
    quality_traits: [{trait: "equals the budget table total (rule family B)", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.TOTAL_BUDGET:
    purpose: {en: "The whole project cost, including any co-funding, so the requested share is visible.", th: NEEDS_INPUT}
    micro_template: {en: "<requested budget + co-funding from other sources>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.TOTAL_BUDGET guidance (one money value)"}
    keep_out: ["co-funding that no source record supports"]
    quality_traits: [{trait: "difference from the requested amount is explained by named co-funders", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.RESEARCH_TYPE:
    purpose: {en: "The type of research as the form's option list names it.", th: NEEDS_INPUT}
    micro_template: {en: "<one option from the form's list, candidate list NEEDS_VERIFICATION>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.RESEARCH_TYPE guidance (one option)"}
    keep_out: ["a type that the design in METHOD.PLAN.DESIGN does not support"]
    quality_traits: [{trait: "consistent with the design paradigm", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.FLAGSHIP:
    purpose: {en: "Whether the project is submitted under a flagship line of the call.", th: NEEDS_INPUT}
    micro_template: {en: "true|false, per the call document", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.FLAGSHIP guidance (boolean)"}
    keep_out: ["a guess when the call does not say"]
    quality_traits: [{trait: "matches the call document, cited", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.MASTER_PLAN:
    purpose: {en: "The national master-plan line the call maps this project to, as the call names it.", th: NEEDS_INPUT}
    micro_template: {en: "<master-plan item as printed in the call document>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.MASTER_PLAN guidance (one option or string)"}
    keep_out: ["a plan line chosen for prestige rather than for the causal chain"]
    quality_traits: [{trait: "the results chain actually reaches the named line", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.CHARACTERISTIC:
    purpose: {en: "New project, or a continuation of an earlier fiscal year (contradiction CX-05, OPEN).", th: NEEDS_INPUT}
    micro_template: {en: "New Project | Continuing Project (candidate, NEEDS_VERIFICATION)", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.CHARACTERISTIC guidance (one option)"}
    keep_out: ["'continuing' without a past-performance table"]
    quality_traits: [{trait: "a continuing project fills CORE.GENERAL.PAST_PERFORMANCE", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.CONTRACT:
    purpose: {en: "Whether the project runs under an existing contract, and which.", th: NEEDS_INPUT}
    micro_template: {en: "false | <contract reference>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.CONTRACT guidance (boolean or string)"}
    keep_out: ["a contract number typed from memory"]
    quality_traits: [{trait: "reference resolves to a document the team holds", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.DURATION_Y:
    purpose: {en: "Project duration in whole years; with DURATION_M it must cover the whole workplan.", th: NEEDS_INPUT}
    micro_template: {en: "<integer years>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.DURATION_Y guidance (integer)"}
    keep_out: ["a duration shorter than the last workplan activity"]
    quality_traits: [{trait: "years plus months equal the workplan span", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.DURATION_M:
    purpose: {en: "The remaining months beyond whole years.", th: NEEDS_INPUT}
    micro_template: {en: "<integer months, 0-11>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.DURATION_M guidance (integer)"}
    keep_out: ["12 or more months (belongs in DURATION_Y)"]
    quality_traits: [{trait: "years plus months equal the workplan span", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OTHER_FUNDER:
    purpose: {en: "Whether the same or a similar project is submitted to, or funded by, another funder.", th: NEEDS_INPUT}
    micro_template: {en: "true|false", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.OTHER_FUNDER guidance (boolean)"}
    keep_out: ["'false' when a related submission exists"]
    quality_traits: [{trait: "'true' is followed by agency, title and difference", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OTHER_FUNDER.AGENCY:
    purpose: {en: "The other funder's name, as it names itself.", th: NEEDS_INPUT}
    micro_template: {en: "<funder name>", th: NEEDS_INPUT}
    length_target: {unit: words, min: 1, max: 30, basis: "proposed_default (one name)"}
    keep_out: ["an abbreviation without the full name"]
    quality_traits: [{trait: "full name, one line", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OTHER_FUNDER.TITLE:
    purpose: {en: "The title of the other submission, so a reader can find it.", th: NEEDS_INPUT}
    micro_template: {en: "<title of the other submission>", th: NEEDS_INPUT}
    length_target: {unit: words, min: 1, max: 40, basis: "proposed_default (one title line)"}
    keep_out: ["a shortened title that differs from the submitted one"]
    quality_traits: [{trait: "exact title", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OTHER_FUNDER.DIFF:
    purpose: {en: "How this project differs from the other submission: scope, site, method or outputs.", th: NEEDS_INPUT}
    micro_template: {en: "This project differs in <scope|site|method|outputs>: <one sentence each>.", th: NEEDS_INPUT}
    length_target: {unit: words, min: 15, max: 200, basis: "proposed_default; NEEDS_VERIFICATION"}
    keep_out: ["a claim that the projects are unrelated without saying how"]
    quality_traits: [{trait: "names the concrete difference per dimension", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.KEYWORDS_TH:
    purpose: {en: "Thai keywords a reviewer would search for: object, method, site or group.", th: NEEDS_INPUT}
    micro_template: {en: "[<object>, <method>, <site or group>, <outcome>]", th: NEEDS_INPUT}
    length_target: {unit: items, min: 3, max: 8, basis: "proposed_default; NEEDS_VERIFICATION (no public page read for a keyword count)"}
    keep_out: ["whole sentences as keywords", "keywords absent from the title and objectives"]
    quality_traits: [{trait: "each keyword appears in the title, objectives or method", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.KEYWORDS_EN:
    purpose: {en: "The same keywords in English, one to one with the Thai list.", th: NEEDS_INPUT}
    micro_template: {en: "[<object>, <method>, <site or group>, <outcome>]", th: NEEDS_INPUT}
    length_target: {unit: items, min: 3, max: 8, basis: "proposed_default; NEEDS_VERIFICATION (no public page read for a keyword count)"}
    keep_out: ["a different number of keywords from the Thai list"]
    quality_traits: [{trait: "one-to-one with the Thai list", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OECD.PRIMARY:
    purpose: {en: "The OECD main field the project's method and object belong to (contradiction CX-10, OPEN).", th: NEEDS_INPUT}
    micro_template: {en: "<one candidate code from mappings/nriis/labels@…, NEEDS_VERIFICATION>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.OECD.PRIMARY guidance (one code)"}
    keep_out: ["a field chosen to match the funder rather than the method"]
    quality_traits: [{trait: "consistent with the design and instruments", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OECD.SECONDARY:
    purpose: {en: "The OECD sub-field under the chosen main field.", th: NEEDS_INPUT}
    micro_template: {en: "<one candidate sub-field code, NEEDS_VERIFICATION>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.OECD.SECONDARY guidance (one code)"}
    keep_out: ["a sub-field outside the chosen main field"]
    quality_traits: [{trait: "nested under the primary code", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.OECD.RELATED:
    purpose: {en: "A further OECD field the project touches, only if it genuinely does.", th: NEEDS_INPUT}
    micro_template: {en: "<code or name of one related field>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 0, max: 1, basis: "registry:CORE.GENERAL.OECD.RELATED guidance (optional, one)"}
    keep_out: ["a related field added to look interdisciplinary"]
    quality_traits: [{trait: "an objective or method visibly draws on it", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.PROGRAMME_NAME:
    purpose: {en: "The programme (set of projects) this project belongs to, if any.", th: NEEDS_INPUT}
    micro_template: {en: "<programme name> | empty for a stand-alone project", th: NEEDS_INPUT}
    length_target: {unit: words, min: 0, max: 40, basis: "registry:CORE.GENERAL.PROGRAMME_NAME guidance (one name, empty if stand-alone)"}
    keep_out: ["a programme name when the project stands alone"]
    quality_traits: [{trait: "matches the programme's own submission", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.SUBPROJECTS:
    purpose: {en: "One row per sub-project: titles, lead and how it serves the shared goal.", th: NEEDS_INPUT}
    micro_template: {en: "SP<n>: <title_th> / <title_en>, led by <team member id>, serves the shared goal by <mechanism>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 0, max: 10, basis: "registry:CORE.GENERAL.SUBPROJECTS guidance (one row per sub-project); proposed_default for the cap"}
    keep_out: ["a sub-project without a named lead"]
    quality_traits: [{trait: "every sub-project names its contribution to the shared goal", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.PAST_PERFORMANCE:
    purpose: {en: "For a continuing project: performance and budget use per earlier fiscal year.", th: NEEDS_INPUT}
    micro_template: {en: "PP<n>: fiscal year <y>, performance <p>% of plan, budget allocated <a>, used <u> (<u/a>%)", th: NEEDS_INPUT}
    length_target: {unit: items, min: 0, max: 10, basis: "registry:CORE.GENERAL.PAST_PERFORMANCE guidance (one row per earlier year); proposed_default for the cap"}
    keep_out: ["percentages that do not follow from the amounts"]
    quality_traits: [{trait: "budget_used_percent equals used over allocated", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.ISCED.BROAD:
    purpose: {en: "ISCED broad field of education and training, from the funder's list (NEEDS_VERIFICATION).", th: NEEDS_INPUT}
    micro_template: {en: "<one broad-field option>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.ISCED.BROAD guidance (one option)"}
    keep_out: ["an option outside the funder's list"]
    quality_traits: [{trait: "consistent with the OECD main field", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.ISCED.NARROW:
    purpose: {en: "ISCED narrow field within the chosen broad field.", th: NEEDS_INPUT}
    micro_template: {en: "<one narrow-field option under the broad field>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.ISCED.NARROW guidance (one option)"}
    keep_out: ["a narrow field outside the chosen broad field"]
    quality_traits: [{trait: "nested under the broad field", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl
  CORE.GENERAL.ISCED.DETAILED:
    purpose: {en: "ISCED detailed field within the chosen narrow field.", th: NEEDS_INPUT}
    micro_template: {en: "<one detailed-field option under the narrow field>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.GENERAL.ISCED.DETAILED guidance (one option)"}
    keep_out: ["a detailed field outside the chosen narrow field"]
    quality_traits: [{trait: "nested under the narrow field", seen_in: NEEDS_INPUT}]
    derived_from: registry/fields.jsonl

  # ---------------------------------------------------------------- CORE.ALIGNMENT
  CORE.ALIGNMENT.POLICY_PATHWAY:
    purpose: {en: "The one policy lens the causal chain actually serves; the chain proves it, naming it does not.", th: NEEDS_INPUT}
    micro_template: {en: "<one policy lens code from ecosystem/positions@…>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.ALIGNMENT.POLICY_PATHWAY guidance (pick one)"}
    keep_out: ["several lenses at once", "a lens the outcomes and impacts never reach"]
    quality_traits: [{trait: "an impact record names a KR under this lens", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.ALIGNMENT.SECONDARY_PATHWAYS:
    purpose: {en: "Only if necessary, up to two further lenses the chain also serves.", th: NEEDS_INPUT}
    micro_template: {en: "[<lens code>, <lens code>]", th: NEEDS_INPUT}
    length_target: {unit: items, min: 0, max: 2, basis: "registry:CORE.ALIGNMENT.SECONDARY_PATHWAYS guidance (up to two)"}
    keep_out: ["a lens added to widen appeal"]
    quality_traits: [{trait: "each secondary lens is reached by a named outcome", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.ALIGNMENT.STATEMENT:
    purpose: {en: "One sentence that ties the project to the call's key result through a direct mechanism, an output and a user.", th: NEEDS_INPUT}
    micro_template: {en: "This project contributes to <primary policy or key result> by <direct mechanism>, producing <output> for use by <user>.", th: NEEDS_INPUT}
    length_target: {unit: words, min: 12, max: 60, basis: "registry:CORE.ALIGNMENT.STATEMENT guidance (one sentence); proposed_default for the word range"}
    keep_out: ["more than one sentence", "a mechanism that no activity implements", "a user absent from RESULTS.CHAIN.USERS"]
    quality_traits: [{trait: "the four slots are each traceable to a record", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.ALIGNMENT.FUND_SELECTION:
    purpose: {en: "Which call objectives the project serves, its one primary key result and any secondary ones.", th: NEEDS_INPUT}
    micro_template: {en: "objective_ids: [<call objective ids>], primary_kr_id: <KR id>, secondary_kr_ids: [<KR ids>]", th: NEEDS_INPUT}
    length_target: {unit: items, min: 1, max: 1, basis: "registry:CORE.ALIGNMENT.FUND_SELECTION guidance (one object, one primary KR)"}
    keep_out: ["more than one primary key result"]
    quality_traits: [{trait: "the primary KR is the one the impact record names", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4

  # ---------------------------------------------------------------- CORE.RESEARCH
  CORE.RESEARCH.NATIONAL_NEED:
    purpose: {en: "The need at national or regional level that the problem sits inside, with its evidence.", th: NEEDS_INPUT}
    micro_template: {en: "<who> needs <what> because <evidence with source>; this matters at <national|regional> level because <consequence>.", th: NEEDS_INPUT}
    length_target: {unit: words, min: 40, max: 300, basis: "proposed_default; core/02 §4A.2 compression target NEEDS_VERIFICATION (source excluded from the public repo)"}
    keep_out: ["a need with no source record", "a need broader than any objective addresses"]
    quality_traits: [{trait: "every factual claim has a source id", seen_in: NEEDS_INPUT}, {trait: "the need is the one the impacts return to", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.RESEARCH.PROBLEM:
    purpose: {en: "The specific problem, in a named site or group, that the project will work on.", th: NEEDS_INPUT}
    micro_template: {en: "In <site or group>, <what goes wrong> for <whom>, shown by <evidence>; the cause we address is <cause>.", th: NEEDS_INPUT}
    length_target: {unit: words, min: 40, max: 300, basis: "proposed_default; core/02 §4A.2 compression target NEEDS_VERIFICATION (source excluded from the public repo)"}
    keep_out: ["a restatement of the national need without a site", "a cause the method cannot reach"]
    quality_traits: [{trait: "names site or group, harm, evidence and the addressed cause", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.RESEARCH.GAP:
    purpose: {en: "What is known, what is unknown or not yet done, and why existing approaches fall short.", th: NEEDS_INPUT}
    micro_template: {en: "Known: <prior knowledge with source>. Unknown or untried: <gap>. Existing approaches fall short because <reason>.", th: NEEDS_INPUT}
    length_target: {unit: words, min: 30, max: 250, basis: "proposed_default; core/02 §4A.2 compression target NEEDS_VERIFICATION (source excluded from the public repo)"}
    keep_out: ["'no study exists' without a prior-knowledge record", "a gap the research question does not enter"]
    quality_traits: [{trait: "links to at least one PriorKnowledge record", seen_in: NEEDS_INPUT}, {trait: "the primary RQ is phrased inside this gap", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.RESEARCH.RQ.PRIMARY:
    purpose: {en: "The one question the project answers; every objective answers part of it.", th: NEEDS_INPUT}
    micro_template: {en: "Does/How does <intervention or factor> <affect or relate to> <outcome> in <site or group> over <period>?", th: NEEDS_INPUT}
    length_target: {unit: words, min: 8, max: 60, basis: "proposed_default (one answerable question); core/02 §4A.2 NEEDS_VERIFICATION"}
    keep_out: ["two questions joined by 'and'", "a question no instrument can answer"]
    quality_traits: [{trait: "links to the Gap", seen_in: NEEDS_INPUT}, {trait: "names outcome, site or group and period", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.RESEARCH.RQ.SECONDARY:
    purpose: {en: "Sub-questions that decompose the primary question, one per entry.", th: NEEDS_INPUT}
    micro_template: {en: "RQ-<n>: <one sub-question of the primary RQ>", th: NEEDS_INPUT}
    length_target: {unit: items, min: 0, max: 5, basis: "proposed_default; core/02 §4A.2 NEEDS_VERIFICATION"}
    keep_out: ["a secondary question outside the primary question's scope"]
    quality_traits: [{trait: "each sub-question is answered by a numbered objective", seen_in: NEEDS_INPUT}]
    derived_from: core/02@sha256:d36e6922a01296bd5001733ca7d5e1d2f6927fbcc08ffebde176d0d2159535a4
  CORE.RESEARCH.OBJECTIVES:
    purpose: {en: "Numbered, verb-led objectives, each answering a research question and each reached by a method and an output.", th: NEEDS_INPUT}
