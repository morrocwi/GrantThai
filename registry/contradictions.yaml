# registry/contradictions.yaml — the contradiction register, as data.
#
# Every contradiction found between the handoff package files (core/01-06)
# and the public source documents SD-1..SD-4 (docs/sources.md) that touches
# GrantThai's data. Nothing here is resolved: each entry keeps BOTH readings,
# says how GrantThai currently behaves, and stays OPEN until a person with
# the authority to decide records a decision (GOVERNANCE.md). The human-
# readable version is docs/contradictions.md; tests/test_contradictions.py
# keeps the two in step and checks that every `conflicts` id in
# registry/fields.jsonl is listed here.
#
# The renderer prints every OPEN entry that touches a field of the project in
# the output section "Conflicts and open contradictions"
# (spec/output/nriis-submission.contract.md). An entry with a `routes` list
# (the CX-7SSA-* entries: routes [academic-article]) concerns only those
# routes and is not printed in the NRIIS output; an entry without one is.
schema: grantthai.contradictions.v0
version: "0.1.0-draft"
contradictions:
  - id: CX-01
    title: "Research Core and Methodology: authoring fields or observed NRIIS fields?"
    status: OPEN
    readings:
      - source: "core/02 §1 R4, §5 04 and 05"
        says: "Research Core (04) and Methodology (05) are AUTHORING_CORE. R4: never present AUTHORING_CORE fields as if they were official NRIIS fields; they reach NRIIS through the narrative renderer (§6)."
      - source: "core/05 (CORE.*, METHOD.* records)"
        says: "source_status OBSERVED on every CORE.* and METHOD.* record, i.e. observed on the NRIIS form."
    current_handling: "origin AUTHORING_CORE (never placed on a tab); source_status kept exactly as core/05 wrote it. The narrative boxes carry render_from."
    affects:
      files: [registry/fields.jsonl, registry/nriis-fields.jsonl]
      sections: [ResearchCore, Methodology]
  - id: CX-02
    title: "Need, Problem, Gap and Innovation: plain text or structured objects?"
    status: OPEN
    readings:
      - source: "core/05 CORE.NATIONAL_NEED, CORE.PROBLEM, CORE.GAP, CORE.INNOVATION"
        says: "type text."
      - source: "core/02 §5 04.01, 04.02, 04.03, 04.08"
        says: "objects with named keys (statement, context, evidence, what_is_known, what_is_new, ...)."
    current_handling: "type rich_text|object: plain text or an object with the core/02 keys are both valid."
    affects:
      fields: [CORE.RESEARCH.NATIONAL_NEED, CORE.RESEARCH.PROBLEM, CORE.RESEARCH.GAP, CORE.RESEARCH.INNOVATION]
  - id: CX-03
    title: "Direction of the Budget-Activity, Ethics-Method and Sites/Partners-Activity edges"
    status: OPEN
    readings:
      - source: "core/06 §3 (top-level architecture) and core/02 §11 (cross-field consistency graph)"
        says: "BUDGET -> ACTIVITIES, ETHICS/COMPLIANCE -> METHODOLOGY, SITES/PARTNERS -> ACTIVITIES."
      - source: "core/06 §4 (proposal entity graph) and §12 (budget graph)"
        says: "ACTIVITY -> BUDGET_ITEM, METHODOLOGY -> ETHICS_REQUIREMENT (RESEARCH_SITE -> ACTIVITY and PARTNER -> ACTIVITY agree with §3)."
    current_handling: "spec/common/chain.yaml uses Activity -> BudgetItem and Method -> EthicsRequirement (core/06 §4/§12). Sites and partners are attribute links, not causal edges."
    affects:
      files: [spec/common/chain.yaml]
      fields: [BUDGET.PLAN.ITEMS, WORK.PLAN.ACTIVITIES, METHOD.PLAN.ETHICS]
  - id: CX-04
    title: "Does Impact follow Beneficiary, or do both follow Outcome?"
    status: OPEN
    readings:
      - source: "core/06 §3"
        says: "OUTCOMES -> BENEFICIARIES -> IMPACTS -> FUNDING KR (a line)."
      - source: "core/02 §11 and core/06 §4"
        says: "Outcome -> Beneficiary and Outcome -> Impact (a fan-out); Impact -> Funding KR."
    current_handling: "spec/common/chain.yaml fans out from Outcome (core/02 §11, core/06 §4)."
    affects:
      files: [spec/common/chain.yaml]
      fields: [RESULTS.CHAIN.BENEFICIARIES, RESULTS.CHAIN.IMPACTS]
  - id: CX-05
    title: "Project characteristic: new project only, or new or continuing?"
    status: OPEN
    readings:
      - source: "core/05 GEN.CHARACTERISTIC"
        says: "allowed_values [\"New Project\"] (one observed form)."
      - source: "SD-1 (edition 2566) p15, part 1 item 3"
        says: "a new project, or a project continuing from an earlier fiscal year, with a past-performance table for a continuing project."
    current_handling: "allowed_values keeps \"New Project\"; \"Continuing Project\" is a candidate value (NEEDS_VERIFICATION) that is accepted with a REVIEW finding (S011). CORE.GENERAL.PAST_PERFORMANCE holds the table."
    affects:
      fields: [CORE.GENERAL.CHARACTERISTIC, CORE.GENERAL.PAST_PERFORMANCE]
  - id: CX-06
    title: "Two different full names for one funding-unit abbreviation"
    status: OPEN
    readings:
      - source: "SD-1 (edition 2566) p5"
        says: "gives one full name for the unit (exact string in docs/sources.md, SD-1 note)."
      - source: "SD-3 (revision 3, edition 2569) PDF p1"
        says: "gives a different full name for the same abbreviation (exact string in docs/sources.md, SD-3 note)."
    current_handling: "Not resolved here. GrantThai names no funding unit in its data; the difference is recorded in docs/sources.md only."
    affects:
      files: [docs/sources.md]
  - id: CX-07
    title: "Expert connections and stakeholder engagement: which tab?"
    status: OPEN
    readings:
      - source: "core/02 §9 compact field map"
        says: "08 Utilization and Translation Pathway -> NRIIS UTILIZATION / RESULTS."
      - source: "SD-1 (edition 2566) p17, part 3 item 9"
        says: "listed under part 3 (the plan section), items 9.1 and 9.2, together with post-project continuation by users."
    current_handling: "mappings/nriis/section_to_tab.yaml keeps TranslationPathway on UTILIZATION, marked NEEDS_VERIFICATION."
    affects:
      files: [mappings/nriis/section_to_tab.yaml]
      fields: [RESULTS.PATHWAY.EXPERTS, RESULTS.PATHWAY.STAKEHOLDERS]
  - id: CX-08
    title: "Expected outcomes: an NRIIS form item or a recommended extension?"
    status: OPEN
    readings:
      - source: "core/02 §5 09.04; core/05 RESULTS.OUTCOMES"
        says: "RECOMMENDED_EXTENSION (core/02) / INFERRED_SCHEMA_EXTENSION (core/05): not confirmed as a native field."
      - source: "SD-1 (edition 2566) p18, part 5 item 4"
        says: "expected outcomes from users' use of the outputs are a numbered form item."
    current_handling: "origin NRIIS_NATIVE (placed on the UTILIZATION tab), source_status kept as core/05 wrote it, marker NEEDS_VERIFICATION."
    affects:
      fields: [RESULTS.CHAIN.OUTCOMES]
  - id: CX-09
    title: "How many form parts (tabs), and in what order?"
    status: OPEN
    readings:
      - source: "core/02 §9 compact field map"
        says: "five: GENERAL, PROJECT, WORKPLAN, UTILIZATION, ATTACHMENTS/VALIDATION."
      - source: "SD-1 (edition 2566) p15-18; SD-4 p164 and p166"
        says: "part 1 general, 2 project, 3 plan, 4 entrepreneur information (if any), 5 output/outcome/impact; SD-4 adds part 5 attachments and part 6 a validation page (its numbering differs from SD-1)."
      - source: "SD-5 (FF full-proposal form, 2570) p1, p3, p6, p12"
        says: "four parts: 1 general (p1), 2 project (p3), 3 workplan (p6), 4 outputs/outcomes/impacts (p12)."
    current_handling: "five tabs kept (NEEDS_VERIFICATION). Entrepreneur information is placed on UTILIZATION. The validation page is not modelled (the worksheet's readiness summary plays that role). Form profiles shipped in v0.2 (mappings/nriis/form_profiles/); no profile overrides the tab order, so SD-5's four-part reading is recorded, not applied."
    affects:
      files: [mappings/nriis/section_to_tab.yaml]
      sections: [Entrepreneur]
      fields: [RESULTS.ENTREPRENEUR.PROFILE]
  - id: CX-10
    title: "OECD primary/secondary or main/sub field?"
    status: OPEN
    readings:
      - source: "core/05 GEN.OECD.PRIMARY, GEN.OECD.SECONDARY"
        says: "a primary and a secondary OECD research field, no option list."
      - source: "SD-1 (edition 2566) p15 item 6 and p20"
        says: "main/sub OECD field ('หลัก/ย่อย'), with a list of 6 main groups and their sub-fields on p20."
    current_handling: "PRIMARY takes a main-group candidate code (1-6), SECONDARY a sub-field candidate code (e.g. 6.3); the list is a candidate (NEEDS_VERIFICATION) and a value outside it gets a REVIEW finding (S011), never a BLOCK."
    affects:
      fields: [CORE.GENERAL.OECD.PRIMARY, CORE.GENERAL.OECD.SECONDARY]
  - id: CX-7SSA-01
    title: '7SSA: two Thai names for each sector'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §1
      says: master Thai sector names, e.g. S2 'แนวทาง ขอบเขต และฐานความรู้', S3 'ฐานแนวคิดและองค์ความรู้เดิม'.
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §5.1 (and the Thai-renderer comments of the LaTeX template)
      says: Thai-7 visible headings, e.g. S2 'แนวทางและขอบเขตการวิเคราะห์', S3 'แนวคิด ทฤษฎี และองค์ความรู้ที่เกี่ยวข้อง'.
    current_handling: The §1 names are the sector ids and print in the [S#] markers; the §5 headings print as the visible headings of the Thai profiles. Neither is changed.
    affects:
      files:
      - routes/academic-article/profiles/INDEX.yaml
      - routes/academic-article/profiles/7ssa-thai-7.yaml
  - id: CX-7SSA-02
    title: '7SSA: which English heading for each sector'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §4
      says: world renderer headings, e.g. S4 'The Unresolved Problem', S5 'Theory / Framework / New Contribution'.
    - source: GLOSA-7SSA LaTeX template (templates/tex/glosa_7ssa_v1.tex, vendored)
      says: section titles, e.g. S4 'Problem in Existing Knowledge', S5 'New Contribution'.
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §15
      says: per article type, e.g. philosophical S6 'Objections and Replies', legal S6 'Counterauthority / Consequences / Limits'.
    current_handling: The article-type overlay (§15) wins when ARTICLE.SSA.ARTICLE_TYPE is set; otherwise the §4 headings. The LaTeX export uses the same resolver and rewrites the template's section titles (INSTINCT precedence, recorded here).
    affects:
      files:
      - routes/academic-article/profiles/7ssa-world.yaml
      - routes/academic-article/profiles/INDEX.yaml
  - id: CX-7SSA-03
    title: '7SSA: how many abstract slots'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §13.2
      says: 'five functional slots: problem, gap, approach, contribution, implication.'
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §13.3
      says: 'the Thai abstract has four: problem, approach, proposal, contribution.'
    - source: GLOSA-7SSA LaTeX template (templates/tex/glosa_7ssa_v1.tex, vendored)
      says: adds a boundary/limitation slot and '150-250 words'.
    current_handling: No abstract structure is imposed; the abstracts print as the researcher wrote them. The word range is not imported (a venue fact, NEEDS_VERIFICATION).
    affects:
      files:
      - routes/academic-article/profiles/INDEX.yaml
  - id: CX-7SSA-04
    title: '7SSA: the expansion rule matches neither compression map'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §17
      says: moving a Thai article to the world form splits Thai Sector 3 into world 3+4 and Thai Sector 4 into world 5+6.
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §5.2, §5.3, §18, §35
      says: the Thai compressions merge S2+S3 and S5+S6 (five) or S4+S5+S6 (four); none maps a Thai 'Sector 3' onto world 3+4.
    current_handling: Only §5/§18/§35 drive the deterministic compression; §17 is guidance for the researcher and is not applied.
    affects:
      files:
      - routes/academic-article/profiles/7ssa-thai-5.yaml
      - routes/academic-article/profiles/7ssa-thai-4.yaml
  - id: CX-7SSA-05
    title: '7SSA: where the core epistemic roles go'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: GLOSA-7SSA LaTeX template, the founder's first version
      says: the core roles (plus a fourth, the accountable approver) only inside the switchable audit appendix.
    - source: glosa P20 (Core Epistemic Structure)
      says: a three-role block near the top of every draft, always on.
    current_handling: GrantThai vendors the glosa-registered copy, which adds the always-on front block and keeps the fourth role as an accountability line in the appendix. The Markdown overview prints its own role block (section 4.8).
    affects:
      files:
      - spec/routes/route.schema.json
  - id: CX-7SSA-06
    title: '7SSA: Thai script and the LaTeX export'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §5
      says: Thai headings and a Thai abstract for Thai targets.
    - source: GLOSA-7SSA LaTeX template (templates/tex/glosa_7ssa_v1.tex, vendored)
      says: a portable pdflatex master; Thai text kept in comments; Thai script needs a XeLaTeX/LuaLaTeX derivative.
    current_handling: 'The tex export is English-only: every Thai value prints as a NEEDS_INPUT note and a Thai-heading profile adds one NEEDS_INPUT note that the Thai layout is not exported. Recorded in docs/deviations.md.'
    affects:
      files:
      - spec/routes/route.schema.json
  - id: CX-7SSA-07
    title: '7SSA: a quartile as a quality gate'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §26, §36
      says: a 'Q1 world quality gate' and a current-Q1 check before submission.
    - source: GrantThai AGENTS.md non-negotiables; the academic-article route
      says: no BLOCK or readiness input rests on a venue fact; every venue fact is NEEDS_VERIFICATION until the researcher supplies the venue's document.
    current_handling: Not imported as a gate. 'Q1' appears only as the source's name for a renderer and as the researcher's own declared target_system. The source's own §27 keeps Thai journals first-class.
    affects:
      files:
      - routes/academic-article/profiles/INDEX.yaml
  - id: CX-7SSA-08
    title: '7SSA: integrity and verification as stored booleans'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §19, §30
      says: 'integrity booleans (citations_verified, all_claims_traceable ...) and human_verified: true on claims.'
    - source: GrantThai review records (spec/common/object-hash.md, grantthai review)
      says: review state lives in named review records tied to content_sha256; a self-set boolean is not a check.
    current_handling: Not imported. The overview prints review gates from review records only.
    affects:
      files:
      - spec/registry/structured_fields.schema.json
  - id: CX-7SSA-09
    title: '7SSA: AI simulation used as review'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §29, §36
      says: AI red-team, desk-reject simulation and analysis of recent journal articles as part of the workflow.
    - source: GrantThai AI-use ceiling (docs/policy/ai-use-ceiling.md); glosa independence ladder
      says: an AI never validates; an AI reading of one's own draft is advisory at most and never a review record.
    current_handling: Not imported. The skill may help the researcher think through objections to their own draft (advisory only); nothing is recorded as a review.
    affects:
      files:
      - docs/policy/ai-use-ceiling.md
  - id: CX-7SSA-10
    title: '7SSA: every sector VERIFIED vs GrantThai''s DRAFT ceiling'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §33
      says: an article is complete when all sectors S1-S7 are VERIFIED.
    - source: GrantThai status model (spec/common/status_permissions.yaml)
      says: the tool never sets a status above DRAFT; higher states come only from named human review records.
    current_handling: Sector status is a readout of what is filled (the sector map), never a stored status.
    affects:
      files:
      - spec/common/status_permissions.yaml
  - id: CX-7SSA-11
    title: '7SSA: article types vs ARTICLE.META.KIND'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: 7SSA master schema v1.0 (founder-authored; sha256 1c8989c0...f980) §15
      says: 'eight article types: conceptual, theory, philosophical, legal, integrative review, formal/mathematical conceptual, CS SoK/survey, policy/governance.'
    - source: GrantThai ARTICLE.META.KIND (router 2026-09-25)
      says: 'six kinds: empirical_research, review, conceptual, case_study, short_communication, other.'
    current_handling: A separate field, ARTICLE.SSA.ARTICLE_TYPE (RECOMMENDED_EXTENSION), carries the eight types; KIND is unchanged. KIND empirical_research with a 7SSA profile is INFO 7SSA-08.
    affects:
      fields:
      - ARTICLE.SSA.ARTICLE_TYPE
  - id: CX-7SSA-12
    title: '7SSA: one output template per route vs a LaTeX export'
    routes: [academic-article]
    status: OPEN
    readings:
    - source: spec/routes/route.schema.json (router v0.3)
      says: exactly one .md.j2 template and one .md file per route.
    - source: GLOSA-7SSA LaTeX template (templates/tex/glosa_7ssa_v1.tex, vendored)
      says: a journal-facing LaTeX manuscript built from the same seven sectors.
    current_handling: The route keeps one Markdown template (the 7SSA body is an included partial) and gains an optional `exports` list; `build --format tex` writes exactly one .tex file instead of the Markdown file.
    affects:
      files:
      - spec/routes/route.schema.json
      - tools/ci/check_one_output.py
