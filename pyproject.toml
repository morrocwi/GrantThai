[project]
name = "grantthai"
version = "0.1.0"
description = "GrantThai — open, unofficial research infrastructure. One project.yaml in, one build/NRIIS_SUBMISSION.md out."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "jinja2>=3"]
# Minimal by design (P3). jsonschema>=4.18 brings `referencing`, used for the
# local, never-fetching $id registry of spec/**/*.schema.json.

[project.optional-dependencies]
ai = []
# Populated in v0.3 (grantthai[ai]). Never imported by the core packages
# (see spec/common/status_permissions.yaml "hard_ceiling" and
# tools/ci/check_no_ai_import.py).
mcp = ["mcp>=1.2"]
# Optional: the official MCP SDK transport for `grantthai-mcp`. Without it
# the server falls back to a built-in JSON-RPC stdio loop (docs/mcp.md).
dev = ["pytest", "reuse"]

[project.scripts]
grantthai = "grantthai.cli:main"
grantthai-mcp = "grantthai.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
