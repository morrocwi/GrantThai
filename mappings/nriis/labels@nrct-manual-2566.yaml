# mappings/nriis/labels@nrct-manual-2566.yaml — CANDIDATE Thai labels and
# code lists, read from public source documents.
#
# STATUS: every entry is a CANDIDATE and NEEDS_VERIFICATION. Nothing in this
# file is declared official or current. The documents describe a form
# edition (SD-1 is edition 2566, SD-4 is a 2566 training handout); today's
# NRIIS form may differ. Before entering anything, check it against the
# current call.
#
# Founder ruling K14 (2026-09-25): labels come from public documents, never
# from the screenshot-derived readout. Nothing here was taken from that
# readout or from the screenshots behind it; every entry cites a public
# document id (docs/sources.md) and a PDF page.
#
# What the renderer does with it: next to a field's LABEL_TH:
# NEEDS_VERIFICATION it prints the candidate, tagged "(candidate,
# NEEDS_VERIFICATION)", with its source. Registry `label_th` stays
# NEEDS_VERIFICATION. The OECD lists are the candidate_values of
# CORE.GENERAL.OECD.PRIMARY / SECONDARY (rule S011: a value outside the list
# gets a REVIEW finding, never a BLOCK). The typologies are guidance for the
# free-text output_type / outcome_type / impact_type keys; no rule enforces
# them.
#
# Transcription notes: `as_printed: false` means the text was normalised:
# `spacing_normalised` (the PDF text layer splits Thai words with spaces) or
# `restored_sara_am` (the SD-4 text layer drops the vowel sign "ำ"; restored
# by hand). A normalised entry is itself NEEDS_VERIFICATION.
#
# No amount, rate or ceiling is copied here: those are fund rules and live
# only in a dated fund profile (P6).
schema: grantthai.nriis_labels.v0
version: "0.1.0-draft"
status: CANDIDATE
status_marker: NEEDS_VERIFICATION
sources:
  SD-1: {edition: "2566", derived_from: "sourcedoc/SD-1@sha256:98423019ad17f0f0aafc3863840e9d7aaa81007a84f3ddd64a10aab689a4b52e"}
  SD-4: {edition: "2566 (training handout)", derived_from: "sourcedoc/SD-4@sha256:29ace18ff6599bef925b254f5d879b9cc267f628b0325d5c0093fa4f49b924dc"}

# Form parts as printed in SD-1 p15-18 (and SD-4 for attachments). Which
# GrantThai tab each part corresponds to is itself NEEDS_VERIFICATION
# (contradictions CX-07, CX-09).
tab_labels:
  GENERAL:     {label_th: "1. ข้อมูลทั่วไป", source: {doc: SD-1, pages: "15"}}
  PROJECT:     {label_th: "2. ข้อมูลโครงการวิจัย", source: {doc: SD-1, pages: "16"}}
  WORKPLAN:    {label_th: "3. ข้อมูลแผนงาน", source: {doc: SD-1, pages: "16-17"}}
  UTILIZATION: {label_th: "5. ผลผลิต/ผลลัพธ์/ผลกระทบ", source: {doc: SD-1, pages: "18"},
                note: "SD-1 part 4 'ข้อมูลผู้ประกอบการ (ถ้ามี)' is also placed on this tab (CX-09)."}
  ATTACHMENTS: {label_th: "ส่วนที่ 5 : เอกสารแนบ", source: {doc: SD-4, pages: "164"},
                note: "SD-4's part numbering differs from SD-1's (CX-09)."}

