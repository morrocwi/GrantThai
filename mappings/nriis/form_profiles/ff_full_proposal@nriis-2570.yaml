# mappings/nriis/form_profiles/ff_full_proposal@nriis-2570.yaml — one proposal form type, read
# from a public document (spec/mappings/form_profile.schema.json).
#
# STATUS: NEEDS_VERIFICATION throughout (founder ruling K14). Source SD-5
# (docs/sources.md): the public blank Fundamental Fund full-proposal form for
# the 2570 fiscal cycle (52 PDF pages). The document has no licence
# statement and is never committed. The page facts below were read from the
# document's text layer at integration (v0.2); they describe one edition and
# are candidates until a person confirms them against the current call.
#
# Corrections made at integration against the page text (the module first
# carried relayed readings):
# - p1: the "work being built on" block (prior result, owner, affiliation,
#   year, TRL/SRL) is asked ONLY when focus area 6 is chosen. It is therefore
#   not an unconditional requirement: `require` is empty and the block is an
#   extra_item with that condition.
# - p9: the 20 percent equipment cap is a share of the budget-receiving
#   unit's research and innovation budget, not of one project's budget. It is
#   not a per-project check and is listed only.
#
# Contradiction CX-09 (form parts and their order) stays OPEN: SD-5 shows
# four parts (p1, p3, p6, p12); no tab_order override is set.
#
# No amount, rate or ceiling is evaluated from here: `budget_rules` are
# candidates only (`evaluable: false`). Evaluated fund rules live in a
# dated fund profile (funds/).
