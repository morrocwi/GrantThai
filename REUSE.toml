version = 1
SPDX-PackageName = "GrantThai"
SPDX-PackageSupplier = "Organization: ARAYA NIKAH SOCIAL ENTERPRISE CO."
SPDX-PackageDownloadLocation = "https://github.com/morrocwi/GrantThai"

# Licensing follows founder ruling K13 (2026-09-25, GOVERNANCE.md):
# code is Apache-2.0; documentation, specifications and data are CC BY 4.0.
# In REUSE.toml the LAST matching annotation wins, so the catch-all comes
# first and the code paths override it.

# Default for everything: documentation, specifications, ontology,
# templates and data (registry, mappings, rule catalog, fund profiles,
# ecosystem files, examples, discovery files, CITATION.cff).
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Yaoharee Lahtee and ARAYA NIKAH SOCIAL ENTERPRISE CO."
SPDX-License-Identifier = "CC-BY-4.0"

# Code: Apache-2.0
[[annotations]]
path = ["src/**", "tools/**", "tests/**", ".githooks/**", ".github/**", "webform/**", "launchers/**", "pyproject.toml", ".gitignore"]
SPDX-FileCopyrightText = "2026 Yaoharee Lahtee and ARAYA NIKAH SOCIAL ENTERPRISE CO."
SPDX-License-Identifier = "Apache-2.0"

# Organisation logo: identification only, all rights reserved (not CC BY 4.0).
[[annotations]]
path = ["docs/assets/ai-civic-knowledge-logo.png"]
SPDX-FileCopyrightText = "2026 ARAYA NIKAH SOCIAL ENTERPRISE CO."
SPDX-License-Identifier = "LicenseRef-Logo-AllRightsReserved"

# Vendored LaTeX template: a byte-identical copy of the glosa-registered
# GLOSA-7SSA paper template (templates/tex/SOURCE.yaml pins its sha256 and
# origin). glosa is CC BY 4.0; the copyright stays with its author.
[[annotations]]
path = ["templates/tex/glosa_7ssa_v1.tex"]
SPDX-FileCopyrightText = "2026 Yaoharee Lahtee"
SPDX-License-Identifier = "CC-BY-4.0"
