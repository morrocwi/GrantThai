# routes/academic-article/sub_profiles/thai-journal.yaml — a sub-profile of
# the academic-article route for a Thai-language or bilingual manuscript
# (schema grantthai.sub_profile.v0, spec/routes/sub_profile.schema.json).
#
# STATUS: NEEDS_VERIFICATION throughout. This is NOT a journal profile and
# names no journal, index (TCI or otherwise), publisher or fee. The
# bilingual defaults below (Thai and English title, abstract and keywords)
# are GrantThai's `proposed_default` reading of common practice and stay
# NEEDS_VERIFICATION until a named venue's current author guidelines are
# supplied by the researcher (spec decision K-R5). A venue fact enters only
# through ARTICLE.VENUE.TARGET, each item with its source (ART010).
schema: grantthai.sub_profile.v0
version: "0.1.0-draft"
route: academic-article
id: thai-journal
title_en: "Thai-language or bilingual journal — GrantThai defaults, not a venue profile"
title_th: NEEDS_INPUT
status: NEEDS_VERIFICATION
# ART001 looks for an abstract in each `abstract` language; ART002 counts
# keywords in each `keywords` language. No public document was read for
# these defaults: nothing here is a venue fact.
languages:
  title: [th, en]
  abstract: [th, en]
  keywords: [th, en]
requirements:
  - item: keyword_count_min
    value: 3
    status: NEEDS_VERIFICATION
    basis: proposed_default
    note_en: "proposed_default: corpus-100 FWP-12 shows keyword presence in 50/100 funded final reports, not a count, and not for articles; SD-5 p3 gives at most 5 for one NRIIS proposal form, which is not a journal. A VENUE.stated_requirements item with a source overrides this band (ART002)."
  - item: keyword_count_max
    value: 6
    status: NEEDS_VERIFICATION
    basis: proposed_default
    note_en: "Upper end of the same proposed_default band; NEEDS_VERIFICATION."
notes:
  - "Bilingual title, abstract and keywords (Thai and English) are GrantThai's proposed_default reading of common practice, NEEDS_VERIFICATION against the venue's own author guidelines (spec decision K-R5)."
  - "Statements the overview lists as commonly expected (presence only, no wording): ethics, AI use, data availability, conflict of interest, funding. Basis: proposed_default; GenAI research-ethics guideline 2569 (National Research Council of Thailand) p.27, authors check the journal's own GenAI rules first. NEEDS_VERIFICATION."
  - "No length targets are shipped: W101/W102 apply to article fields only with a sourced target (spec §4.3)."
  - "No reference style is shipped: the researcher declares a label in ARTICLE.META.REFERENCE_STYLE; GrantThai never reformats citations."
  - "Defaults only. Whether a venue is indexed anywhere, and by whom, is a venue fact GrantThai never states (OK003: hosting is not indexing). Word limits, scope, fees and review time are NEEDS_VERIFICATION unless the researcher supplies the venue's own document."
