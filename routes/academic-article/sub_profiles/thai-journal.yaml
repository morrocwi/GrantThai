# routes/academic-article/sub_profiles/thai-journal.yaml — a sub-profile of
# the academic-article route for a Thai-language or bilingual manuscript
# (schema grantthai.sub_profile.v0, spec/routes/sub_profile.schema.json).
#
# STATUS: NEEDS_VERIFICATION throughout. This is NOT a journal profile and
# names no journal, index (TCI or otherwise), publisher or fee. The
# bilingual defaults below (Thai and English title, abstract and keywords)
# are GrantThai's `proposed_default` reading of common practice and stay
# NEEDS_VERIFICATION until a named venue's current author guidelines are
# supplied by the researcher (spec decision K-R5). A venue fact enters only
# through ARTICLE.VENUE.TARGET, each item with its source (ART010).
schema: grantthai.sub_profile.v0
version: "0.1.0-draft"
route: academic-article
id: thai-journal
title_en: "Thai-language or bilingual journal — GrantThai defaults, not a venue profile"
title_th: NEEDS_INPUT
status_marker: NEEDS_VERIFICATION
source: null           # no public document read; nothing here is a venue fact
abstract:
  languages: [th, en]  # ART001 looks for an abstract in each listed language
  basis: "proposed_default (bilingual abstract); NEEDS_VERIFICATION against the venue's own author guidelines"
title:
  languages: [th, en]
  basis: "proposed_default (bilingual title); NEEDS_VERIFICATION"
keywords:
  languages: [th, en]
  min: 3
  max: 6
  basis: "proposed_default (corpus-100 FWP-12 shows keyword presence in 50/100 funded final reports, not a count, and not for articles; SD-5 p3 gives at most 5 for one NRIIS proposal form, which is not a journal); NEEDS_VERIFICATION; a VENUE.stated_requirements item with a source overrides this band (ART002)"
length_targets: []     # none shipped: W101/W102 apply to article fields only with a sourced target (spec §4.3)
statements:
  expected: [ETHICS, AI_USE, DATA_AVAILABILITY, CONFLICT_OF_INTEREST, FUNDING]
  basis: "proposed_default; GenAI research-ethics guideline 2569 (National Research Council of Thailand) p.27 (authors check the journal's own GenAI rules first); NEEDS_VERIFICATION"
reference_style:
  value: null          # the researcher's declared label (ARTICLE.REFERENCE_STYLE); GrantThai never reformats citations
  basis: "proposed_default: none"
notes: "Defaults only. Whether a venue is indexed anywhere, and by whom, is a venue fact GrantThai never states (OK003: hosting is not indexing). Word limits, scope, fees and review time are NEEDS_VERIFICATION unless the researcher supplies the venue's own document."
