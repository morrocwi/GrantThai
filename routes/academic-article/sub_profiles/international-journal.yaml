# routes/academic-article/sub_profiles/international-journal.yaml — the
# default sub-profile of the academic-article route (schema
# grantthai.sub_profile.v0, spec/routes/sub_profile.schema.json).
#
# STATUS: NEEDS_VERIFICATION throughout. This is NOT a journal profile.
# GrantThai ships no venue registry and names no journal, publisher, index
# or fee. A sub-profile only says which of GrantThai's own descriptive
# checks apply by default (which abstract languages ART001 looks at, the
# keyword band ART002 uses) and every default here is `proposed_default`.
# A venue fact enters only through the researcher's ARTICLE.VENUE.TARGET
# record, each stated requirement with the source they supplied (ART010);
# such an item overrides the defaults below.
schema: grantthai.sub_profile.v0
version: "0.1.0-draft"
route: academic-article
id: international-journal
title_en: "International journal (English manuscript) — GrantThai defaults, not a venue profile"
title_th: NEEDS_INPUT
status_marker: NEEDS_VERIFICATION
source: null           # no public document read; nothing here is a venue fact
abstract:
  languages: [en]      # ART001 looks for an abstract in each listed language
  basis: "proposed_default; NEEDS_VERIFICATION against the venue's own author guidelines"
title:
  languages: [en]
  basis: "proposed_default; NEEDS_VERIFICATION"
keywords:
  languages: [en]
  min: 3
  max: 6
  basis: "proposed_default (corpus-100 FWP-12 shows keyword presence in 50/100 funded final reports, not a count, and not for articles); NEEDS_VERIFICATION; a VENUE.stated_requirements item with a source overrides this band (ART002)"
length_targets: []     # none shipped: W101/W102 apply to article fields only with a sourced target (spec §4.3)
statements:
  # Which statements the overview lists as commonly expected. Presence
  # only; GrantThai does not know any venue's wording.
  expected: [ETHICS, AI_USE, DATA_AVAILABILITY, CONFLICT_OF_INTEREST, FUNDING]
  basis: "proposed_default; GenAI research-ethics guideline 2569 (National Research Council of Thailand) p.27 (authors check the journal's own GenAI rules first); NEEDS_VERIFICATION"
reference_style:
  value: null          # the researcher's declared label (ARTICLE.REFERENCE_STYLE); GrantThai never reformats citations
  basis: "proposed_default: none"
notes: "Defaults only. Word limits, indexing, scope, fees and review time of any venue are NEEDS_VERIFICATION unless the researcher supplies the venue's own document."
