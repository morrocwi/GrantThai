  # --- T20: narrative boxes ---------------------------------------------------
  - field_id: CORE.NARRATIVE.SUMMARY
    value: "(ร่างโดย AI ผู้วิจัยสมมติยังไม่ยืนยัน) โครงการหนึ่งปีนี้ใช้การวิจัยเชิงปฏิบัติการแบบมีส่วนร่วมสามวงกับครัวเรือนชาวนาและผู้ร่วมวิจัยชุมชนในสามหมู่บ้านของอำเภอสมมติ เพื่อสำรวจพันธุ์ข้าวพื้นบ้านที่เหลืออยู่ ออกแบบและทดลองกติกาธนาคารเมล็ดพันธุ์ที่ชุมชนตั้งเอง และเชื่อมธนาคารทั้งสามเป็นเครือข่ายเรียนรู้ ผลผลิตคือทะเบียนพันธุ์ กติกาสามชุด คู่มือ และข้อเสนอเชิงนโยบายถึงเจ้าหน้าที่ส่งเสริมการเกษตรของอำเภอ"
    by: ai
    source_ids: [SRC-T20]
  - field_id: CORE.NARRATIVE.RATIONALE
    value: "ชาวนารายย่อยในอำเภอสมมติต้องซื้อเมล็ดพันธุ์ทุกฤดูและพันธุ์พื้นบ้านค่อย ๆ หายไป (สมมติ) ในสามหมู่บ้านครัวเรือนเก็บเมล็ดกันเองโดยไม่มีกติกากลางและเมล็ดงอกไม่ดี งานแลกเปลี่ยนที่เคยจัดครั้งเดียวไม่มีผู้ดูแลต่อ ยังไม่มีกติกาที่ชุมชนออกแบบเองสำหรับธนาคารเมล็ดพันธุ์ที่เชื่อมกันเป็นเครือข่าย โครงการนี้จึงถามว่าธนาคารแบบนี้ช่วยให้ครัวเรือนเข้าถึงเมล็ดพันธุ์ที่งอกดีได้หรือไม่ ภายใต้เงื่อนไขใด"
    by: researcher_edited_ai_draft
    provenance_class: DERIVED
    source_ids: [SRC-T20]
