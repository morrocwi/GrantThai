sibling_infrastructure:
  - id: toledo
    role: "Equation registry and proof framework GrantThai's founder also maintains; related to, but not the same as, the conceptual Toledo ecosystem above. GrantThai uses none of its content."
    url: "https://github.com/morrocwi/toledo"
    doi: "10.5281/zenodo.22537318"
  - id: glosa
    role: "Human-AI knowledge co-production methodology (maker/checker discipline, claim cards)."
    url: "https://github.com/morrocwi/glosa"
  - id: main_hub
