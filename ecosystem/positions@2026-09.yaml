    source: "core/02 §4A.1"
    trust_level: RELAYED
    markers: [NEEDS_VERIFICATION]
  - code: RESEARCH_KNOWLEDGE
    name_en: "Research knowledge"
    question: "What new, validated, reusable knowledge or method does the project create?"
    typical_outputs: [evidence, dataset, framework, model, method, publication]
    source: "core/02 §4A.1"
    trust_level: RELAYED
    markers: [NEEDS_VERIFICATION]
  - code: INNOVATION_TRANSLATION
    name_en: "Innovation translation"
    question: "How does knowledge move toward validation, adoption, commercialization, or scale?"
