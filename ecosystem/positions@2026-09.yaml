    source: "core/02 §4A.1"
    trust_level: RELAYED
    markers: [NEEDS_VERIFICATION]
  - code: AREA_SOCIETAL
    name_en: "Area-based / societal"
    question: "What real problem in a place, community, public system, or social group is being solved with users involved?"
    typical_outputs: [social_innovation, service_model, local_mechanism, living_lab, community_capacity, policy_tool]
    source: "core/02 §4A.1"
    trust_level: RELAYED
    markers: [NEEDS_VERIFICATION]
  - code: CREATIVE_ECONOMY
    name_en: "Creative economy"
    question: "How are cultural, creative, design, local-knowledge, IP, or digital assets converted into measurable value?"
    typical_outputs: [creative_IP, product_or_service, design_framework, cultural_database, market_or_place_value]
    source: "core/02 §4A.1"
    trust_level: RELAYED
    markers: [NEEDS_VERIFICATION]
  - code: MISSION_SECTOR
    name_en: "Mission / sector"
    question: "Which national or sector mission does the project directly strengthen?"
    typical_domains: [health, AI, semiconductor, food, agritech, climate, net_zero, advanced_industry, other_current_mission]
    note: "The domain list is the package's example list, not a current mission list (NEEDS_VERIFICATION)."
    source: "core/02 §4A.1"
    trust_level: RELAYED
    markers: [NEEDS_VERIFICATION]

