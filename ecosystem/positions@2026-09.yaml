# ecosystem/positions@2026-09.yaml — optional ecosystem/policy position
# picklist. RELAYED and dated (plan section B, P8: never forced).
#
# Content is RELAYED from the handoff package core/02 (founder-owned, K13):
# the six broad policy lenses of core/02 §4A.1 and the eleven potential
# ecosystem positions of core/02 §4G. It is a design vocabulary, not a
# statement of any current Thai policy, plan, programme or key result: every
# entry is NEEDS_VERIFICATION against current public policy documents before
# anyone relies on it.
#
# How it is used:
#   - `lenses[].code` is the option list of CORE.ALIGNMENT.POLICY_PATHWAY and
#     CORE.ALIGNMENT.SECONDARY_PATHWAYS (registry/fields.jsonl). Pick ONE
#     primary lens, and at most two secondary lenses only if necessary
#     (core/02 §4A.1). A lens is proven by the project's causal chain, not by
#     naming it (core/02 §4A.1 "Policy alignment rule", §4D).
#   - `positions[].id` may be listed in project.yaml `ecosystem_positions`.
#     A project selects only the positions it actually participates in
#     (core/02 §4G). Choosing none is always valid (P8).
