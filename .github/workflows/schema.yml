name: schema-lint
on: [push, pull_request]
jobs:
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml jsonschema
      - name: Parse, meta-validate schemas, validate instances, cross-file checks
        run: python tools/ci/check_schema_lint.py --root .
      - name: NOTICE constant reused verbatim
        run: python tools/ci/check_notice.py --root .
