name: leak-scan
on: [push, pull_request]
jobs:
  leak-pii-scan:
    runs-on: ubuntu-latest
    env:
      GRANTTHAI_LEAKDENY: ${{ secrets.GRANTTHAI_LEAKDENY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/ci/check_leak_pii.py --root .
